<style>__BASE_CSS__</style>

@font-face{font-family:MoonveilIcons;src:url("__ICON_FONT__") format("woff2");font-weight:900;font-display:block}.icon{font:900 20px MoonveilIcons;font-style:normal;display:inline-block;width:1.2em;text-align:center}
html{--sheldWidth:92vw}body{margin:0;overflow:hidden}.demo-top button{display:grid;place-items:center;width:100%;min-height:38px;border-radius:5px;padding:7px;color:#bcb9dc}.demo-top button:hover,.demo-top button[aria-pressed=true]{background:#7567a84d;color:#e0d9ff}.demo-top>button .icon{pointer-events:none}aside[hidden]{display:none!important}aside:not([hidden]){display:block!important}aside h2{font:600 20px/1.5 "SimSun",serif;color:#d3cfe9;margin:0 0 24px}aside h3{font-size:14px;color:#c5c7de;border-bottom:1px solid #727fa052;padding-bottom:10px;margin:26px 0 16px}aside label{display:block;font-size:14px;line-height:1.6;margin:16px 0;color:#bec5dd}aside input[type=range]{display:block;width:100%;accent-color:#9586d1;margin-top:12px}aside input[type=checkbox]{display:inline;width:auto;accent-color:#9586d1}aside output{float:right;font-size:12px;color:#aca3dc}aside p{color:#a4acc4;line-height:1.8}.preview-close{float:right;padding:6px;border:0}.preview-link{display:block;color:#bcb2e8;font-size:13px;padding:10px 0}.demo-foot{position:absolute;right:8px;bottom:-18px;font-size:10px;padding:0;color:#9ba5bb}.demo-foot:empty{display:none}#chat .mes .mes_buttons button{font-size:14px;color:inherit;padding:3px}.mes_buttons .icon{font-size:14px}.mes_text[contenteditable=true]{outline:2px solid #9e8acf;outline-offset:2px}.character-swatch{height:170px;background:#2c334a;border:1px solid #6c769356}.character-swatch img{width:100%;height:100%;object-fit:contain}.preview-note{font-size:12px;margin-top:24px}.demo-close-panel{display:none}#left-nav-panel{width:350px;padding:28px}#right-nav-panel{width:400px}.demo-top button[aria-label="阅读设置"]{margin-top:10px;border-top:1px solid #707b9c66}.hide-demo-avatars #chat .mesAvatarWrapper{display:none}.hide-demo-time #chat .timestamp{display:none}.compact-demo #chat .mes{margin-bottom:10px}
@media(min-width:1100px){body.reference-view #sheld{left:456px;width:calc(100dvw - 482px)}body.reference-view #left-nav-panel{top:var(--cc-stage-top);bottom:var(--cc-stage-bottom);height:auto;max-height:none}body.reference-view #chat{padding-top:14px}}
@media(max-width:1000px){.demo-top button{width:auto;flex:1;min-width:0;padding:4px;min-height:30px}.demo-top button[aria-label="阅读设置"]{margin:0;border:0}#left-nav-panel,#right-nav-panel{width:auto;padding:18px}.demo-foot{font-size:8px}#send_form>button{flex-basis:30px}.demo-top .icon{font-size:17px}}
</style></head><body>
<nav class="demo-top" aria-label="主题演示工具栏">
<button data-scene="chat" aria-label="对话" title="对话" aria-pressed="true"><i class="icon" aria-hidden="true">&#xf086;</i></button>
<button data-panel="right-nav-panel" aria-label="角色" title="角色"><i class="icon" aria-hidden="true">&#xf007;</i></button>
<button data-scene="long" aria-label="长篇阅读" title="长篇阅读"><i class="icon" aria-hidden="true">&#xf02d;</i></button>
<button data-scene="rich" aria-label="代码与表格" title="代码与表格"><i class="icon" aria-hidden="true">&#xf121;</i></button>
<button data-scene="reasoning" aria-label="思考区" title="思考区"><i class="icon" aria-hidden="true">&#xf075;</i></button>
<button data-scene="composer" aria-label="多行输入" title="多行输入"><i class="icon" aria-hidden="true">&#xf303;</i></button>
<button data-panel="left-nav-panel" aria-label="阅读设置" title="阅读设置"><i class="icon" aria-hidden="true">&#xf1de;</i></button>
<button id="reset-preview" aria-label="重置演示" title="重置演示"><i class="icon" aria-hidden="true">&#xf2ea;</i></button>
</nav>
<aside id="left-nav-panel" hidden><button class="preview-close" aria-label="关闭设置"><i class="icon" aria-hidden="true">&#xf00d;</i></button><h2>阅读设置</h2>
<h3>显示</h3><label>页面宽度 <output id="width-value">92%</output><input id="width-range" type="range" min="25" max="100" value="92" aria-label="页面宽度"></label><label>正文字号 <output id="size-value">20 px</output><input id="font-range" type="range" min="15" max="24" value="20" aria-label="正文字号"></label>
<h3>外观</h3><label>龙的亮度 <output id="art-value">95%</output><input id="art-range" type="range" min="20" max="100" value="95" aria-label="龙的亮度"></label>
<h3>对话</h3><label><input type="checkbox" id="avatars-toggle" checked> 显示角色头像</label><label><input type="checkbox" id="time-toggle" checked> 显示时间</label><label><input type="checkbox" id="compact-toggle"> 紧凑间距</label><label><input type="checkbox" id="head-clearance-toggle"> 桌面龙头避让（预留顶部空间）</label>
<h3>排版验收</h3><button type="button" data-scene="short">短消息</button> <button type="button" data-scene="empty">空聊天</button><p class="preview-note">演示中的调整仅影响当前页面。</p><a class="preview-link" href="./moonveil.theme.json" download>下载酒馆主题 JSON</a><a class="preview-link" href="./moonveil.studio.json" download>下载可编辑工程</a></aside>
<section id="sheld"><main id="chat" aria-label="主题示例对话"></main><form id="send_form"><button type="button" id="options" aria-label="打开阅读设置"><i class="icon" aria-hidden="true">&#xf1de;</i></button><textarea id="send_textarea" aria-label="示例消息输入框" placeholder="输入消息…"></textarea><button type="submit" aria-label="追加示例消息"><i class="icon" aria-hidden="true">&#xf1d8;</i></button></form><output class="demo-foot" role="status" id="preview-status"></output></section>
<aside id="right-nav-panel" hidden><button class="preview-close" aria-label="关闭角色"><i class="icon" aria-hidden="true">&#xf00d;</i></button><h2>角色</h2><div class="character-swatch"><img src="__DRAGON_AVATAR__" alt="银龙"></div><b>银龙</b><p>来自银脊山脉的守望者。</p><button id="codex-scene" type="button">查看契约示例</button></aside>
<script>
const chat=document.querySelector('#chat'),input=document.querySelector('#send_textarea');
const portraits={dragon:'__DRAGON_AVATAR__',traveler:'__TRAVELER__'};
function closePanels(){document.querySelectorAll('aside').forEach(el=>el.hidden=true);document.body.classList.remove('reference-view');}
function panel(id){const el=document.getElementById(id),wasHidden=el.hidden;closePanels();el.hidden=!wasHidden;}
function message(user,html,textOnly=false){const el=document.createElement('article');el.className='mes';el.setAttribute('is_user',String(user));el.setAttribute('is_system','false');el.innerHTML='<div class="mesAvatarWrapper"><div class="avatar"><img alt="角色头像" src="'+(user?portraits.traveler:portraits.dragon)+'"></div></div><div class="mes_block"><div class="ch_name"><span class="name_text">'+(user?'旅人':'银龙')+'</span><small class="timestamp">23:47</small><span class="mes_buttons"><button aria-label="编辑这条示例消息"><i class="icon" aria-hidden="true">&#xf303;</i></button></span></div><div class="mes_text"></div></div>';const text=el.querySelector('.mes_text');if(textOnly){const p=document.createElement('p');p.textContent=html;text.append(p);}else{text.innerHTML=html;}el.querySelector('button').addEventListener('click',event=>{const editing=text.contentEditable!=='true';text.contentEditable=String(editing);event.currentTarget.setAttribute('aria-label',editing?'完成编辑':'编辑这条示例消息');if(editing)text.focus();});return el;}
function scene(value='chat'){closePanels();chat.replaceChildren();input.value='';input.style.height='';document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===value)));chat.append(message(true,'<p>雪落在银廷的石阶上。</p><p>巨龙俯下身，月光沿着银白的鳞片缓缓流动。</p>'));const first=message(false,'<p>风穿过高塔，带来远方的雪。你抬起头，便能看见更广阔的世界。</p><p>“我愿以真名，换取通往群山的道路。”</p>');chat.append(first);const text=first.querySelector('.mes_text');if(value==='long'){text.innerHTML=Array.from({length:14},(_,i)=>'<p>'+['雪从破碎的穹顶缓缓落下。石柱上镌刻着古老的龙语，每一道痕迹都比王国的历史更为久远。','你走过长廊，听见冰层深处低沉的回响。那不是风声，而是一座山脉在梦中呼吸。','巨龙没有催促。它折起宽阔的翼膜，月光在鳞甲上游移，像一条终于平静下来的冰河。'][i%3]+'</p>').join('');}if(value==='rich'){text.innerHTML='<p>双方接受以下契约。</p><blockquote>真名不可伪造，誓言不可转让。</blockquote><table><thead><tr><th>条款</th><th>旅人</th><th>银龙</th></tr></thead><tbody><tr><td>代价</td><td>一段记忆</td><td>穿越银脊的庇护</td></tr><tr><td>期限</td><td>下一次满月</td><td>誓约解除之时</td></tr></tbody></table><pre><code>const covenant = {\n  keeper: "Sevyran",\n  condition: "A name freely given can never be taken back by another keeper."\n};</code></pre>';}if(value==='reasoning'){
first.classList.add('reasoning');
const details=document.createElement('details');details.open=true;details.className='mes_reasoning_details';details.dataset.hasContent='true';
details.innerHTML='<summary class="mes_reasoning_summary flex-container"><div class="mes_reasoning_header_block flex-container"><div class="mes_reasoning_header flex-container"><span class="mes_reasoning_header_title">思考区样式示例</span><span class="mes_reasoning_arrow" aria-hidden="true">⌃</span></div></div><div class="mes_reasoning_actions flex-container"><button type="button" class="mes_button mes_reasoning_edit" aria-label="编辑示例思考"><i class="icon" aria-hidden="true">&#xf303;</i></button><button type="button" class="mes_reasoning_edit_done edit_button" aria-label="完成思考编辑">✓</button><button type="button" class="mes_reasoning_edit_cancel edit_button" aria-label="取消思考编辑">×</button></div></summary><div class="mes_reasoning"><p>月相封缄展开，露出安静的内页。</p><p>这是用于验证折叠、编辑与夜间对比度的示例文字，不是实际模型推理。</p></div>';
let saved='';
details.querySelector('.mes_reasoning_edit').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const body=details.querySelector('.mes_reasoning');saved=body.innerHTML;const editor=document.createElement('textarea');editor.className='reasoning_edit_textarea';editor.setAttribute('aria-label','示例思考编辑框');editor.value=body.innerText;details.append(editor);editor.focus();});
for(const [selector,commit] of [['.mes_reasoning_edit_done',true],['.mes_reasoning_edit_cancel',false]])details.querySelector(selector).addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const editor=details.querySelector('.reasoning_edit_textarea');if(!editor)return;const body=details.querySelector('.mes_reasoning');if(commit){body.replaceChildren();const p=document.createElement('p');p.textContent=editor.value;body.append(p);}else body.innerHTML=saved;editor.remove();});
text.before(details);
}if(value==='composer'){input.value='我摘下沾雪的斗篷，向银龙行礼。\n“在我开口之前，请允许我问一个问题。”\n我抬起头，等待它的回应。';input.style.height='120px';}if(value==='short'){chat.querySelector('.mes_text').innerHTML='<p>好。</p>';text.innerHTML='<p>我在。</p>';}if(value==='empty')chat.replaceChildren();chat.scrollTop=0;document.querySelector('#preview-status').textContent='';}
for(const b of document.querySelectorAll('[data-scene]'))b.addEventListener('click',()=>scene(b.dataset.scene));for(const b of document.querySelectorAll('[data-panel]'))b.addEventListener('click',()=>panel(b.dataset.panel));for(const b of document.querySelectorAll('.preview-close'))b.addEventListener('click',closePanels);document.querySelector('#options').addEventListener('click',()=>panel('left-nav-panel'));document.querySelector('#codex-scene').addEventListener('click',()=>scene('rich'));
for(const [id,out,property,unit,scale] of [['width-range','width-value','--sheldWidth','vw',1],['font-range','size-value','--cc-font-size','px',1],['art-range','art-value','--cc-art-opacity','',100]])document.getElementById(id).addEventListener('input',e=>{document.documentElement.style.setProperty(property,e.target.value/scale+unit);document.getElementById(out).value=e.target.value+(unit==='px'?' px':'%');document.body.classList.remove('reference-view');});
for(const [id,cl] of [['avatars-toggle','hide-demo-avatars'],['time-toggle','hide-demo-time']])document.getElementById(id).addEventListener('change',e=>document.body.classList.toggle(cl,!e.target.checked));document.querySelector('#compact-toggle').addEventListener('change',e=>document.body.classList.toggle('compact-demo',e.target.checked));
document.querySelector('#head-clearance-toggle').addEventListener('change',e=>document.documentElement.style.setProperty('--cc-head-clearance',e.target.checked?'clamp(32px,calc(var(--cc-dragon-width) * .125),130px)':'0px'));
document.querySelector('#reset-preview').addEventListener('click',()=>{for(const p of ['--sheldWidth','--cc-font-size','--cc-art-opacity','--cc-head-clearance'])document.documentElement.style.removeProperty(p);document.querySelector('#width-range').value=92;document.querySelector('#width-value').value='92%';document.querySelector('#font-range').value=20;document.querySelector('#size-value').value='20 px';document.querySelector('#art-range').value=95;document.querySelector('#art-value').value='95%';document.body.classList.remove('hide-demo-avatars','hide-demo-time','compact-demo');document.querySelector('#avatars-toggle').checked=true;document.querySelector('#time-toggle').checked=true;document.querySelector('#compact-toggle').checked=false;document.querySelector('#head-clearance-toggle').checked=false;scene();});
document.querySelector('#send_form').addEventListener('submit',e=>{e.preventDefault();if(!input.value.trim())return;chat.append(message(true,input.value,true));input.value='';chat.scrollTop=chat.scrollHeight;document.querySelector('#preview-status').textContent='已追加示例消息 · 未调用模型';});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels();});
function syncFontControl(){const px=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cc-font-size'));document.querySelector('#font-range').value=px;document.querySelector('#size-value').value=px+' px';}
window.addEventListener('resize',syncFontControl);document.querySelector('#reset-preview').addEventListener('click',syncFontControl);
scene();syncFontControl();if(new URLSearchParams(location.search).has('reference')){document.querySelector('#left-nav-panel').hidden=false;document.body.classList.add('reference-view');}
</script></body></html>

#chat .mes .avatar img{width:100%;height:100%;max-height:none;object-fit:cover;border-radius:50%}
#chat .mes .ch_name{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:26px;margin:0 0 12px;padding:0 2px;border:0;color:var(--cc-silver)}
#chat .mes .ch_name::after{content:"✧";order:2;flex:1 1 24px;min-width:16px;margin:0 10px;color:#a9a1cc88;font:15px/1.5 Georgia,serif;text-align:center;background:linear-gradient(90deg,transparent,#96a3c754,transparent) center/100% 1px no-repeat;pointer-events:none}
#chat .mes .name_text{margin:0;color:var(--cc-silver);font-size:16px;line-height:1.5;font-weight:600}
#chat .mes .timestamp{margin:0;color:var(--cc-muted);font-size:10px;font-weight:400}
#chat .mes .mes_buttons{order:3;color:var(--cc-muted);margin-left:auto;gap:6px;font-size:13px}
#chat .mes .mes_buttons .mes_button{min-width:24px;min-height:24px;padding:4px}
#chat .mes .mes_button:hover{color:#e1ddff;background:#8283b62b;border-radius:4px}
/* A clean reading center with painted corners. Never stretch the center wing crest:
   its border slice is masked out and the footer renders the same source at fixed scale. */
#chat .mes .mes_text{position:relative;isolation:isolate;box-sizing:border-box;padding:calc(var(--cc-message-padding) + 12px) calc(var(--cc-message-padding) + 12px) calc(var(--cc-message-padding) + 20px);border:1px solid #7e8dab66;border-radius:3px;background:radial-gradient(ellipse at 100% 100%,#64739816,transparent 65%),repeating-linear-gradient(135deg,#c8d0f003 0 1px,transparent 1px 5px),linear-gradient(150deg,#10182844,transparent 70%),var(--cc-message);box-shadow:inset 0 0 0 4px #10182744,inset 0 0 0 5px #9aa9c522,0 6px 12px #090d1a40;color:var(--cc-text);font-size:calc(var(--cc-font-size) * var(--fontScale,1));line-height:var(--cc-line-height);max-width:100%;overflow-wrap:anywhere;text-shadow:none}
#chat .mes .mes_text::before{content:"";position:absolute;z-index:-1;inset:0;border:0 solid transparent;border-image:var(--cc-codex-art) 25% / var(--cc-card-corner) / 0 stretch;opacity:var(--cc-detail-opacity);pointer-events:none;mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--cc-card-corner)) no-repeat,linear-gradient(#000 0 0) bottom left/var(--cc-card-corner) var(--cc-card-corner) no-repeat,linear-gradient(#000 0 0) bottom right/var(--cc-card-corner) var(--cc-card-corner) no-repeat}
#chat .mes .mes_text::after{content:"";position:absolute;z-index:-1;bottom:-4px;left:calc(50% - 70px);width:140px;height:36px;background:var(--cc-codex-art) center bottom/350px 350px no-repeat;opacity:var(--cc-detail-opacity);pointer-events:none}
/* Purple correspondence uses a stitched inset rule and a separate wax seal. */
#chat .mes[is_user=true] .mes_text{padding-bottom:calc(var(--cc-message-padding) + 12px);padding-right:calc(var(--cc-message-padding) + var(--cc-seal-size) + 22px);border-color:#9b8eae77;border-radius:12px 3px 12px 3px;background:radial-gradient(ellipse at 10% 0,#9583be18,transparent 70%),repeating-linear-gradient(45deg,#cdbbef04 0 1px,transparent 1px 4px),var(--cc-user);box-shadow:inset 0 0 0 4px #14152655,inset 0 0 0 5px #aa94c52b,0 6px 12px #090d1a40}
#chat .mes[is_user=true] .mes_text::before{inset:7px;z-index:-1;border:1px dashed #b9a6cf55;border-image:none;border-radius:7px 1px 7px 1px;mask:none;background:linear-gradient(135deg,#bcb2d255,transparent 14px) left top/20px 20px no-repeat,linear-gradient(315deg,#bcb2d255,transparent 14px) right bottom/20px 20px no-repeat}
#chat .mes[is_user=true] .mes_text::after{z-index:0;top:-15px;bottom:auto;left:auto;right:14px;width:var(--cc-seal-size);height:calc(var(--cc-seal-size) * 1.5);background:var(--cc-seal-art) center top/contain no-repeat;opacity:var(--cc-detail-opacity);filter:drop-shadow(0 3px 2px #120c2644)}
#chat .mes[is_user=true] .mes_text:has(>p:first-child){padding-right:calc(var(--cc-message-padding) + 12px)}
#chat .mes[is_user=true] .mes_text>p:first-child{min-height:calc(var(--cc-seal-size) * 1.5 - var(--cc-message-padding) - 27px);padding-right:calc(var(--cc-seal-size) + 2px)}
#chat .mes[is_system=true] .mes_text{padding:var(--cc-message-padding);border:1px solid #747c9b26;border-radius:5px;background:#242c3d;box-shadow:none}
#chat .mes[is_system=true] .mes_text::before,#chat .mes[is_system=true] .mes_text::after,#chat .mes .mes_text:empty::before,#chat .mes .mes_text:empty::after{content:none}
#chat .mes .mes_text:empty{padding:0;border:0;background:none;box-shadow:none}
#chat .mes .mes_text p{margin:0 0 14px}#chat .mes .mes_text p:last-child{margin-bottom:0}
#chat .mes .mes_text :is(h1,h2,h3){color:#d5d8e8;line-height:1.5;margin:18px 0 10px}
#chat .mes .mes_text strong{color:#e1ddea}#chat .mes .mes_text em{color:#b6bbd8}
#chat .mes .mes_text :is(q,q em){color:#bcb2e8}
#chat .mes .mes_text a{color:#b6c6ed;text-decoration:underline;text-underline-offset:3px}
#chat .mes .mes_text blockquote{position:relative;margin:20px 0;padding:12px 18px 12px 24px;border:1px solid #9a8cc02b;border-left:2px solid #a99ac6;border-radius:0 7px 7px 0;background:linear-gradient(90deg,#9683b414,transparent),#151d3044;color:#c6bde4}
#chat .mes .mes_text blockquote::before{content:"◆";position:absolute;top:12px;left:-6px;color:#bdb0de;font-size:9px;line-height:1.5;pointer-events:none}
#chat .mes .mes_text pre{box-sizing:border-box;max-width:100%;margin:16px 0;padding:16px;overflow-x:auto;background:#161d2e;color:#c3cce0;border:1px solid #616d924f;border-radius:7px}
#chat .mes .mes_text pre code{background:none;color:inherit;font:13px/1.7 Consolas,monospace;white-space:pre;word-break:normal;overflow-wrap:normal}
#chat .mes .mes_text :not(pre)>code{background:#11182760;color:#c2badf;padding:2px 5px;border-radius:3px}
#chat .mes .mes_text table{width:100%;max-width:100%;table-layout:fixed;border-collapse:collapse;margin:16px 0;font-size:14px}
#chat .mes .mes_text :is(th,td){padding:10px;border:1px solid #7782a24f;text-align:left;overflow-wrap:anywhere}
#chat .mes .mes_text th{background:#42496166;color:#d4d7e4}
#chat .mes .mes_text :is(img,video,iframe){max-width:100%}
/* Native ST 1.19 header/actions/arrow DOM. No display override on details or actions:
   hidden reasoning, editing controls and thinking state remain owned by ST. */
#chat .mes .mes_reasoning_details{position:relative;margin:0 0 16px;border:1px solid #9888ba66;border-radius:12px 3px 12px 3px;background:linear-gradient(120deg,#8c7baf0e,transparent 65%),#24283b;box-shadow:inset 0 0 0 3px #10162644,inset 0 0 0 4px #8d82af22}
#chat .mes .mes_reasoning_summary{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;margin:0;padding:5px 10px;list-style:none;color:#cec3e7;font-size:13px;cursor:pointer}
#chat .mes .mes_reasoning_summary::-webkit-details-marker{display:none}
#chat .mes .mes_reasoning_header_block{display:flex;align-items:center;gap:12px;flex:1 1 0;min-width:0}
#chat .mes .mes_reasoning_header_block::after{content:"";flex:0 0 108px;width:108px;height:22px;background:var(--cc-clasp-art) center/contain no-repeat;opacity:var(--cc-detail-opacity);pointer-events:none}
#chat .mes .mes_reasoning_header{align-items:center;flex:1 1 0;min-width:0;margin:0;padding:8px 28px 8px 30px;border:0;border-radius:0;background:none;color:inherit;font-size:inherit}
#chat .mes .mes_reasoning_header::before{content:"☾";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:1px solid #baabd36b;border-radius:50%;color:#c9b7ed;background:#3e345b;box-shadow:inset 0 0 0 2px #1c2135;font:18px/20px Georgia,serif;text-align:center;pointer-events:none}
#chat .mes .mes_reasoning_header_title{min-width:0;overflow-wrap:anywhere;line-height:1.6;font-weight:500}
#chat .mes .mes_reasoning_actions{align-items:center;flex:0 0 auto;gap:4px;margin-left:auto;color:#b0a5c9}
#chat .mes .mes_reasoning_actions .mes_button{min-width:24px;min-height:24px;padding:5px;font-size:12px}
#chat .mes .mes_reasoning_details[open] .mes_reasoning_summary{border-bottom:1px solid #a391c33b;background:linear-gradient(90deg,#8671af0b,#b7a1d70b,transparent)}
#chat .mes .mes_reasoning_details:focus-within{border-color:#b09dce}
#chat .mes .mes_reasoning{margin:10px 16px 16px 24px;padding:4px 12px 4px 16px;border-left:1px solid #9d87c177;background:linear-gradient(90deg,#a68acf08,transparent 50%);color:#b7bdd3;font-size:calc(14px * var(--fontScale,1));line-height:1.85;overflow-wrap:anywhere}
#chat .mes .mes_reasoning :is(p,ul,ol){margin:0 0 10px}
#chat .mes .mes_reasoning :last-child{margin-bottom:0}
#chat .mes .mes_reasoning pre{max-width:100%;overflow-x:auto;padding:10px;background:#181e30;border:1px solid #7e729d44;border-radius:4px}
#chat .mes .mes_text details{margin:14px 0;padding:10px 14px;border:1px solid var(--cc-line);border-radius:6px}
#chat .mes .mes_text summary{cursor:pointer;color:#c1b6e7}
#chat .mes :is(.edit_textarea,.reasoning_edit_textarea){width:100%;min-height:140px;padding:16px;color:var(--cc-text);background:#242b41;border:1px solid #8a83b3;font-size:var(--cc-font-size)}
#chat .mes :is(.mesIDDisplay,.mes_timer,.tokenCounterDisplay){color:var(--cc-muted);font-size:10px}
#chat .mes .swipeRightBlock{bottom:0;right:10px;font-size:11px}#chat .mes :is(.swipe_left,.swipe_right){color:#b9add8}
/* Writing strip; native quick replies and send/stop visibility remain owned by ST. */
#form_sheld{flex:0 0 auto;width:100%;min-width:0;margin:0}
#send_form{position:relative;box-sizing:border-box;flex:0 0 auto;width:100%;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:0;padding:14px 20px 16px;border:0;border-top:1px solid #737e9a88;border-radius:0 0 8px 8px;background:#202536;backdrop-filter:none;box-shadow:none}

function message(user,html,textOnly=false){const el=document.createElement('article');el.className='mes';el.setAttribute('is_user',String(user));el.setAttribute('is_system','false');el.innerHTML='<div class="mesAvatarWrapper"><div class="avatar"><img alt="角色头像" src="'+(user?portraits.traveler:portraits.dragon)+'"></div></div><div class="mes_block"><div class="ch_name"><span class="name_text">'+(user?'旅人':'银龙')+'</span><small class="timestamp">23:47</small><span class="mes_buttons"><button aria-label="编辑这条示例消息"><i class="icon" aria-hidden="true">&#xf303;</i></button></span></div><div class="mes_text"></div></div>';const text=el.querySelector('.mes_text');if(textOnly){const p=document.createElement('p');p.textContent=html;text.append(p);}else{text.innerHTML=html;}el.querySelector('button').addEventListener('click',event=>{const editing=text.contentEditable!=='true';text.contentEditable=String(editing);event.currentTarget.setAttribute('aria-label',editing?'完成编辑':'编辑这条示例消息');if(editing)text.focus();});return el;}
function scene(value='chat'){closePanels();chat.replaceChildren();input.value='';input.style.height='';document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===value)));chat.append(message(true,'<p>雪落在银廷的石阶上。</p><p>巨龙俯下身，月光沿着银白的鳞片缓缓流动。</p>'));const first=message(false,'<p>风穿过高塔，带来远方的雪。你抬起头，便能看见更广阔的世界。</p><p>“我愿以真名，换取通往群山的道路。”</p>');chat.append(first);const text=first.querySelector('.mes_text');if(value==='long'){text.innerHTML=Array.from({length:14},(_,i)=>'<p>'+['雪从破碎的穹顶缓缓落下。石柱上镌刻着古老的龙语，每一道痕迹都比王国的历史更为久远。','你走过长廊，听见冰层深处低沉的回响。那不是风声，而是一座山脉在梦中呼吸。','巨龙没有催促。它折起宽阔的翼膜，月光在鳞甲上游移，像一条终于平静下来的冰河。'][i%3]+'</p>').join('');}if(value==='rich'){text.innerHTML='<p>双方接受以下契约。</p><blockquote>真名不可伪造，誓言不可转让。</blockquote><table><thead><tr><th>条款</th><th>旅人</th><th>银龙</th></tr></thead><tbody><tr><td>代价</td><td>一段记忆</td><td>穿越银脊的庇护</td></tr><tr><td>期限</td><td>下一次满月</td><td>誓约解除之时</td></tr></tbody></table><pre><code>const covenant = {\n  keeper: "Sevyran",\n  condition: "A name freely given can never be taken back by another keeper."\n};</code></pre>';}if(value==='reasoning'){
first.classList.add('reasoning');
const details=document.createElement('details');details.open=true;details.className='mes_reasoning_details';details.dataset.hasContent='true';
details.innerHTML='<summary class="mes_reasoning_summary flex-container"><div class="mes_reasoning_header_block flex-container"><div class="mes_reasoning_header flex-container"><span class="mes_reasoning_header_title">思考区样式示例</span><span class="mes_reasoning_arrow" aria-hidden="true">⌃</span></div></div><div class="mes_reasoning_actions flex-container"><button type="button" class="mes_button mes_reasoning_edit" aria-label="编辑示例思考"><i class="icon" aria-hidden="true">&#xf303;</i></button><button type="button" class="mes_reasoning_edit_done edit_button" aria-label="完成思考编辑">✓</button><button type="button" class="mes_reasoning_edit_cancel edit_button" aria-label="取消思考编辑">×</button></div></summary><div class="mes_reasoning"><p>月相封缄展开，露出安静的内页。</p><p>这是用于验证折叠、编辑与夜间对比度的示例文字，不是实际模型推理。</p></div>';
let saved='';
details.querySelector('.mes_reasoning_edit').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const body=details.querySelector('.mes_reasoning');saved=body.innerHTML;const editor=document.createElement('textarea');editor.className='reasoning_edit_textarea';editor.setAttribute('aria-label','示例思考编辑框');editor.value=body.innerText;details.append(editor);editor.focus();});
for(const [selector,commit] of [['.mes_reasoning_edit_done',true],['.mes_reasoning_edit_cancel',false]])details.querySelector(selector).addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const editor=details.querySelector('.reasoning_edit_textarea');if(!editor)return;const body=details.querySelector('.mes_reasoning');if(commit){body.replaceChildren();const p=document.createElement('p');p.textContent=editor.value;body.append(p);}else body.innerHTML=saved;editor.remove();});
text.before(details);
}if(value==='composer'){input.value='我摘下沾雪的斗篷，向银龙行礼。\n“在我开口之前，请允许我问一个问题。”\n我抬起头，等待它的回应。';input.style.height='120px';}if(value==='short'){chat.querySelector('.mes_text').innerHTML='<p>好。</p>';text.innerHTML='<p>我在。</p>';}if(value==='empty')chat.replaceChildren();chat.scrollTop=0;document.querySelector('#preview-status').textContent='';}
for(const b of document.querySelectorAll('[data-scene]'))b.addEventListener('click',()=>scene(b.dataset.scene));for(const b of document.querySelectorAll('[data-panel]'))b.addEventListener('click',()=>panel(b.dataset.panel));for(const b of document.querySelectorAll('.preview-close'))b.addEventListener('click',closePanels);document.querySelector('#options').addEventListener('click',()=>panel('left-nav-panel'));document.querySelector('#codex-scene').addEventListener('click',()=>scene('rich'));
for(const [id,out,property,unit,scale] of [['width-range','width-value','--sheldWidth','vw',1],['font-range','size-value','--cc-font-size','px',1],['art-range','art-value','--cc-art-opacity','',100]])document.getElementById(id).addEventListener('input',e=>{document.documentElement.style.setProperty(property,e.target.value/scale+unit);document.getElementById(out).value=e.target.value+(unit==='px'?' px':'%');document.body.classList.remove('reference-view');});
for(const [id,cl] of [['avatars-toggle','hide-demo-avatars'],['time-toggle','hide-demo-time']])document.getElementById(id).addEventListener('change',e=>document.body.classList.toggle(cl,!e.target.checked));document.querySelector('#compact-toggle').addEventListener('change',e=>document.body.classList.toggle('compact-demo',e.target.checked));
document.querySelector('#head-clearance-toggle').addEventListener('change',e=>document.documentElement.style.setProperty('--cc-head-clearance',e.target.checked?'clamp(32px,calc(var(--cc-dragon-width) * .125),130px)':'0px'));
document.querySelector('#reset-preview').addEventListener('click',()=>{for(const p of ['--sheldWidth','--cc-font-size','--cc-art-opacity','--cc-head-clearance'])document.documentElement.style.removeProperty(p);document.querySelector('#width-range').value=92;document.querySelector('#width-value').value='92%';document.querySelector('#font-range').value=20;document.querySelector('#size-value').value='20 px';document.querySelector('#art-range').value=95;document.querySelector('#art-value').value='95%';document.body.classList.remove('hide-demo-avatars','hide-demo-time','compact-demo');document.querySelector('#avatars-toggle').checked=true;document.querySelector('#time-toggle').checked=true;document.querySelector('#compact-toggle').checked=false;document.querySelector('#head-clearance-toggle').checked=false;scene();});
document.querySelector('#send_form').addEventListener('submit',e=>{e.preventDefault();if(!input.value.trim())return;chat.append(message(true,input.value,true));input.value='';chat.scrollTop=chat.scrollHeight;document.querySelector('#preview-status').textContent='已追加示例消息 · 未调用模型';});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels();});
function syncFontControl(){const px=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cc-font-size'));document.querySelector('#font-range').value=px;document.querySelector('#size-value').value=px+' px';}
window.addEventListener('resize',syncFontControl);document.querySelector('#reset-preview').addEventListener('click',syncFontControl);
scene();syncFontControl();if(new URLSearchParams(location.search).has('reference')){document.querySelector('#left-nav-panel').hidden=false;document.body.classList.add('reference-view');}
</script></body></html>

<script>
const portraits={assistant:'__PORTRAIT_A__',user:'__PORTRAIT_U__'};
const chat=document.querySelector('#chat'),input=document.querySelector('#send_textarea');
const settings=`<h2>阅读设置</h2><label>页面宽度 <output id="width-value">80%</output><input id="width-range" type="range" min="35" max="99" value="80" aria-label="页面宽度"></label><label>正文字号 <output id="font-value">20 px</output><input id="font-range" type="range" min="15" max="28" value="20" aria-label="正文字号"></label><label><input id="avatar-toggle" type="checkbox" checked>显示头像</label><label><input id="floor-toggle" type="checkbox" checked>显示楼层号</label><label><input id="time-toggle" type="checkbox" checked>显示时间</label><label>验收场景<select id="preview-scene" aria-label="验收场景"><option value="chat">概念图对话</option><option value="long">长篇阅读</option><option value="short">短消息</option><option value="rich">引用、代码与表格</option><option value="reasoning">思考展开与编辑</option><option value="iframe">嵌入卡片</option><option value="composer">多行输入</option><option value="empty">空聊天</option></select></label><div class="preview-tools"><button class="menu_button" id="simulate-generation">模拟发送/停止</button><button class="menu_button" id="reset-preview">重置</button></div><p class="preview-note">此页使用虚构内容，不调用模型。原生主题保留酒馆的页面宽度、字体缩放和显示开关。</p><p><a href="./moonveil.theme.json" download>下载主题 JSON</a></p><p><a href="./moonveil.studio.json" download>下载可编辑工程</a></p>`;

function closePanels(){document.querySelectorAll('.drawer-content').forEach(e=>e.classList.remove('openDrawer'));document.querySelectorAll('.drawer-icon').forEach(e=>{e.classList.replace('openIcon','closedIcon');e.setAttribute('aria-expanded','false')});}

function reasoning(el,open=false){
 el.classList.add('reasoning');const d=document.createElement('details');d.className='mes_reasoning_details';d.dataset.hasContent='true';d.open=open;
 d.innerHTML='<summary class="mes_reasoning_summary flex-container"><div class="mes_reasoning_header_block flex-container"><div class="mes_reasoning_header flex-container"><span class="mes_reasoning_header_title">思考了一会</span><span class="mes_reasoning_arrow fa-solid">&#xf077;</span></div></div><div class="mes_reasoning_actions flex-container"><button class="mes_button fa-solid mes_reasoning_edit" aria-label="编辑示例思考">&#xf303;</button><button class="edit_button fa-solid mes_reasoning_edit_done" aria-label="完成思考编辑">&#xf00c;</button><button class="edit_button fa-solid mes_reasoning_edit_cancel" aria-label="取消思考编辑">&#xf00d;</button></div></summary><div class="mes_reasoning"><p>这是用于检查折叠与编辑状态的示例文字。</p><p>展开的内页保持安静的底色和足够的行距。</p></div>';
 d.querySelector('.mes_reasoning_edit').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(d.querySelector('textarea'))return;const editor=document.createElement('textarea');editor.className='reasoning_edit_textarea';editor.setAttribute('aria-label','示例思考编辑框');editor.value=d.querySelector('.mes_reasoning').innerText;d.querySelector('.mes_reasoning').before(editor);editor.focus();editor.setSelectionRange(editor.value.length,editor.value.length);const overflow=editor.getBoundingClientRect().bottom-chat.getBoundingClientRect().bottom;if(overflow>0)chat.scrollTop+=overflow;});
 d.querySelector('.mes_reasoning_edit_done').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const editor=d.querySelector('textarea');if(editor){d.querySelector('.mes_reasoning').textContent=editor.value;editor.remove();}});
 d.querySelector('.mes_reasoning_edit_cancel').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();d.querySelector('textarea')?.remove();});
 el.querySelector('.mes_text').before(d);
}
function message(user,html,id=chat.children.length+30){
 const el=document.createElement('article');el.className='mes';el.setAttribute('is_user',String(user));el.setAttribute('is_system','false');el.setAttribute('mesid',id);
 el.innerHTML='<div class="mesAvatarWrapper"><div class="avatar"><img alt="示例角色头像" src="'+portraits[user?'user':'assistant']+'"></div><div class="mesIDDisplay">#'+id+'</div></div><div class="mes_block"><div class="ch_name flex-container justifySpaceBetween"><div class="flex-container flex1 alignitemscenter"><div class="flex-container alignItemsBaseline"><span class="name_text">'+(user?'春猫儿':'顾渡舟')+'</span><small class="timestamp">'+(id===30?'20:53':'21:31')+'</small></div></div><div class="mes_buttons"><button class="mes_button fa-solid" aria-label="示例消息操作">&#xf141;</button><button class="mes_button mes_edit fa-solid" aria-label="编辑示例消息">&#xf303;</button></div><div class="mes_edit_buttons"></div></div><div class="mes_text">'+html+'</div><div class="mes_media_wrapper"></div><div class="mes_file_wrapper"></div></div>';
 const tools=el.querySelector('.mes_edit_buttons');
 for(const [cls,label,glyph] of [['mes_edit_done','确认示例编辑','f00c'],['mes_edit_copy','复制示例消息','f0c5'],['mes_edit_add_reasoning','添加示例思考','f0eb'],['mes_edit_delete','删除示例消息','f2ed'],['mes_edit_up','上移示例消息','f077'],['mes_edit_down','下移示例消息','f078'],['mes_edit_cancel','取消示例编辑','f00d']]){const b=document.createElement('button');b.className=cls+' menu_button fa-solid';b.setAttribute('aria-label',label);b.innerHTML='&#x'+glyph+';';tools.append(b);}
 let before='';
 const endEdit=save=>{const t=el.querySelector('.mes_text'),editor=t.querySelector('textarea');if(!editor)return;if(save)t.textContent=editor.value;else t.innerHTML=before;tools.style.display='none';el.querySelector('.mes_buttons').style.display='';el.querySelector('.reasoning_edit_textarea')?.remove();};
 el.querySelector('.mes_edit').addEventListener('click',()=>{const t=el.querySelector('.mes_text');if(t.querySelector('textarea'))return;before=t.innerHTML;const value=t.innerText;t.replaceChildren();tools.style.display='inline-flex';el.querySelector('.mes_buttons').style.display='none';const r=el.querySelector('details[open] .mes_reasoning_edit');r?.click();const editor=document.createElement('textarea');editor.className='edit_textarea';editor.setAttribute('aria-label','示例正文编辑框');editor.value=value;t.append(editor);editor.focus();editor.setSelectionRange(value.length,value.length);});
 el.querySelector('.mes_edit_done').addEventListener('click',()=>endEdit(true));el.querySelector('.mes_edit_cancel').addEventListener('click',()=>endEdit(false));
 el.querySelector('.mes_edit_add_reasoning').addEventListener('click',()=>{if(!el.querySelector('.mes_reasoning_details'))reasoning(el,true);});
 el.querySelector('.mes_edit_delete').addEventListener('click',()=>el.remove());
 el.querySelector('.mes_edit_copy').addEventListener('click',()=>{const copy=message(user,'',chat.children.length+30);copy.querySelector('.mes_text').textContent=el.querySelector('.edit_textarea')?.value||el.querySelector('.mes_text').innerText;el.after(copy);});
 el.querySelector('.mes_edit_up').addEventListener('click',()=>{if(el.previousElementSibling)el.previousElementSibling.before(el);});
 el.querySelector('.mes_edit_down').addEventListener('click',()=>{if(el.nextElementSibling)el.nextElementSibling.after(el);});

const first='<p>夜色沿着城堡的高窗缓缓落下，银色月光穿过拱廊，在石阶上铺开一道安静的光。</p><p>他合上手中的旧书，指尖停在那枚月牙形的银扣上。窗外的风掠过塔尖，远处传来一声悠长的钟鸣。</p><p>桌上的茶还温着。细窄的缎带从书页间垂下来，末端缀着一枚小小的银月，随着烛火轻轻摇曳。</p><blockquote>“如果今夜的故事还未写完，就再陪我坐一会儿。”</blockquote><p>他没有催促，只将身旁的椅子拉近了一些。那封未寄出的信安静地躺在两人之间，封蜡上留着清晰的月纹。</p><p>火光在他眼底微微跳动，映出一片温柔而遥远的光，仿佛那里藏着无数个尚未说完的夜晚。</p>';
const reply='<p>我把书签放回书里，接过茶，在他身旁坐下。</p><p>“那就从你停下的地方，继续讲吧。”</p>';
const last='<p>他笑了一下，将那本古旧的书重新翻开。页角的银色纹路在月光下亮了起来，像一条通往远方的细小河流。</p><p>故事从很久以前的一个冬夜开始。那时城堡的钟还会在午夜响起，而每一个听见钟声的人，都相信明天会有好消息。</p><p>他指着书页上泛黄的字迹，声音低而平静，像是在与很久以前的自己对话——</p><p>“那是一个被遗忘的年代，但有些光，至今仍在黑暗中为我们指引方向。”</p>';
function scene(kind='chat'){closePanels();chat.replaceChildren();input.value='我靠近一些，望向他指尖停留的那一页……';input.style.height='';chat.append(message(false,first,30),message(true,reply,31));const end=message(false,last,32);chat.append(end);reasoning(end,kind==='reasoning');if(kind==='reasoning')end.querySelector('.mes_reasoning').innerHTML=Array.from({length:32},(_,i)=>'<p>推理编辑示例 '+(i+1)+'：点击小铅笔应从开头开始，确认、取消和正文都保持原生布局。</p>').join('');if(kind==='long')chat.firstElementChild.querySelector('.mes_text').innerHTML=Array.from({length:28},()=>'<p>夜色沿着长廊延伸。翻过这一页，远处钟塔的回声依旧清晰，风从群山之间带来清冷的月光。</p>').join('');if(kind==='short'){chat.replaceChildren(message(false,'<p>我在。</p>',30),message(true,'<p>好。</p>',31))}if(kind==='rich')chat.firstElementChild.querySelector('.mes_text').innerHTML='<h2>月下的契约</h2><p>常规正文、<em>强调</em>与<strong>重要文字</strong>。</p><blockquote>长夜仍会过去。</blockquote><table><thead><tr><th>条款</th><th>旅人</th><th>银龙</th></tr></thead><tbody><tr><td>代价</td><td>一段记忆</td><td>穿越群山的庇护</td></tr><tr><td>期限</td><td>下一次满月</td><td>誓约解除之时</td></tr></tbody></table><pre><code>const covenant = { keeper: "moon", condition: "A name freely given can never be taken back by another keeper, regardless of the kingdom or the distance." };</code></pre>';if(kind==='iframe'){const frame=document.createElement('iframe');frame.title='独立嵌入卡片示例';frame.style.cssText='width:100%;height:270px;border:0';frame.srcdoc='<body style="background:#eeeade;color:#423e36;font:20px Georgia;padding:30px"><h2>独立嵌入卡片</h2><p>主题保留卡片内部原有的配色和交互。</p><button onclick="this.textContent=\'已点击\'">检查按钮</button></body>';chat.firstElementChild.querySelector('.mes_text').replaceChildren(frame)}if(kind==='composer'){input.value='我摘下沾雪的斗篷，向银龙行礼。\n在我开口之前，请允许我问一个问题。\n我抬起头，等待它的回应。';input.style.height='126px'}if(kind==='empty')chat.replaceChildren();chat.scrollTop=0;document.querySelector('#preview-status').textContent='';document.querySelector('#preview-scene').value=kind;}
for(const b of document.querySelectorAll('[data-scene]'))b.addEventListener('click',()=>scene(b.dataset.scene));document.querySelector('#preview-scene').addEventListener('change',e=>scene(e.target.value));
document.querySelector('#options_button').addEventListener('click',()=>togglePanel('user-settings-block'));document.querySelector('#extensionsMenuButton').addEventListener('click',()=>scene('composer'));
for(const [id,out,prop,suffix] of [['width-range','width-value','--sheldWidth','vw'],['font-range','font-value','--cc-font-size','px']])document.getElementById(id).addEventListener('input',e=>{document.documentElement.style.setProperty(prop,e.target.value+suffix);document.getElementById(out).value=e.target.value+(suffix==='vw'?'%':' px')});
for(const [id,cl] of [['avatar-toggle','hideChatAvatars'],['floor-toggle','no-mesIDDisplay'],['time-toggle','no-timestamps']])document.getElementById(id).addEventListener('change',e=>document.body.classList.toggle(cl,!e.target.checked));
document.querySelector('#send_but').addEventListener('click',()=>{if(!input.value.trim())return;const e=message(true,'',chat.children.length+30);e.querySelector('.mes_text').textContent=input.value;chat.append(e);input.value='';input.style.height='';chat.scrollTop=chat.scrollHeight;document.querySelector('#preview-status').textContent='已追加本地示例消息；未调用模型'});
document.querySelector('#simulate-generation').addEventListener('click',()=>{closePanels();document.querySelector('#send_but').style.display='none';document.querySelector('#mes_stop').style.display='flex';document.querySelector('#preview-status').textContent='模拟生成状态；未调用模型'});
document.querySelector('#mes_stop').addEventListener('click',()=>{document.querySelector('#send_but').style.display='';document.querySelector('#mes_stop').style.display='none';document.querySelector('#preview-status').textContent='模拟已停止'});
document.querySelector('#reset-preview').addEventListener('click',()=>{for(const prop of ['--sheldWidth','--cc-font-size'])document.documentElement.style.removeProperty(prop);document.body.classList.remove('hideChatAvatars','no-mesIDDisplay','no-timestamps');for(const id of ['avatar-toggle','floor-toggle','time-toggle'])document.getElementById(id).checked=true;document.querySelector('#width-range').value=80;document.querySelector('#width-value').value='80%';document.querySelector('#font-range').value=20;document.querySelector('#font-value').value='20 px';scene()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});

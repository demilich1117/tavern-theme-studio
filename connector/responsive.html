<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒馆 · 设计工作台</title>
<style>
:root{color-scheme:dark;--page:#17191d;--panel:#202329;--line:#3b3f48;--text:#e7e8ea;--muted:#b0b5bf;--accent:#dfaf70}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--page);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);z-index:2}.brand{display:flex;align-items:center;gap:10px;margin-right:auto;white-space:nowrap}.brand small{color:var(--muted);font-size:12px;font-weight:400}.device-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.segmented{display:flex;gap:4px}button,select,input,summary{font:inherit}button,select,input,.dimensions>summary{min-height:36px;background:var(--page);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px}button,summary{cursor:pointer}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:#dfaf7010}input{width:84px}label{display:flex;gap:6px;align-items:center}.dimensions{position:relative}.dimensions>summary{list-style:none}.dimensions>summary::-webkit-details-marker{display:none}.dimensions form{position:absolute;top:calc(100% + 8px);right:0;display:grid;gap:12px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 8px 24px #0006}.hint{padding:6px 16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:32px}.hint span{flex:1}.hint button{min-height:28px;padding:2px 8px}.hint.error{color:#ffb4a4}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px)}.viewport-space{overflow:auto;padding:20px;background:radial-gradient(#ffffff12 1px,transparent 1px);background-size:16px 16px;min-width:0}.device{margin:auto;width:max-content}.device small{display:block;padding:0 0 8px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.viewport-frame{position:relative;box-shadow:0 8px 30px #0004;outline:1px solid var(--line);border-radius:4px;overflow:hidden}iframe{border:0;display:block;background:var(--page)}#host{width:390px;height:844px;transform-origin:top left}#editor{width:100%;height:100%;border-left:1px solid var(--line)}.editor-hidden main{grid-template-columns:minmax(0,1fr)}.editor-hidden #editor{display:none}.mobile-views{display:none}button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:850px){header{padding:8px 12px;gap:8px}.brand{flex:1}.brand small{display:none}.device-tools{width:100%;gap:6px}.device-tools button,.dimensions>summary{padding-inline:9px}.mobile-views{display:flex}#toggle-editor{display:none}.hint{padding-inline:12px}.viewport-space{padding:12px}main,.editor-hidden main{display:block;position:relative}.viewport-space{height:100%}#editor{position:absolute;inset:0;border:0;display:none}body[data-view=editor] #editor{display:block}body[data-view=editor] .viewport-space{visibility:hidden}.device-tools>label>span{display:none}}
</style></head>
<body data-view="preview">
<header><div class="brand"><b>酒馆 · 设计工作台</b><small>真实页面，边看边改</small></div>
<nav class="mobile-views segmented" aria-label="工作区域"><button data-view="preview" aria-pressed="true">预览</button><button data-view="editor" aria-pressed="false">编辑</button></nav>
<div class="device-tools" aria-label="预览尺寸"><div class="segmented"><button data-size="390,844" aria-pressed="true">手机</button><button data-size="1440,900" aria-pressed="false">电脑</button></div>
<details class="dimensions"><summary>自定尺寸</summary><form id="dimensions-form"><label>宽 <input id="width" aria-label="预览宽度" type="number" min="320" max="2560" value="390" required></label><label>高 <input id="height" aria-label="预览高度" type="number" min="480" max="1600" value="844" required></label><button type="submit">应用尺寸</button></form></details>
<label><span>显示</span><select id="zoom" aria-label="预览缩放"><option value="fit">适合窗口</option><option value="1">100%</option></select></label><button id="toggle-editor" aria-expanded="true" aria-controls="editor">收起编辑</button>
</div></header>
<div class="hint" role="status"><span id="status">正在准备虚构测试对话…</span><button id="retry" hidden>重新连接</button></div>
<main><section class="viewport-space" aria-label="真实酒馆预览"><div class="device"><small id="size">390 × 844 · 手机视口</small><div class="viewport-frame"><iframe id="host" title="真实酒馆预览" allow="clipboard-write; display-capture"></iframe></div></div></section><iframe id="editor" title="设计工作台编辑面板" allow="clipboard-write"></iframe></main>
<script type="module" src="./responsive.js"></script></body></html>
